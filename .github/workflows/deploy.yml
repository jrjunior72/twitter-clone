name: CI/CD Pipeline

on:
  push:
    branches:
      - main   # dispara quando você faz push no branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ssh.pythonanywhere.com >> ~/.ssh/known_hosts

      - name: Deploy no PythonAnywhere
        run: |
          ssh -i ~/.ssh/id_ed25519 ricardoferreirajr@ssh.pythonanywhere.com "
            cd /home/ricardoferreirajr/twitter-clone-fixed/backend &&
            git pull &&
            source env/bin/activate &&
            python manage.py migrate &&
            touch reload
          "

